# .github/workflows/verify.yml
# Tests for every pull request (tooling changes and submissions alike). Runs
# with a read-only token and no secrets. Submissions are unsigned until a
# maintainer signs them, so the repository-wide strict check lives in
# resign.yml on main instead.

name: verify

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No signature check here: an update PR changes a signed mod, so its old
      # signature cannot match until CI re-signs it after the merge.
      - name: Signature format and CI rule tests
        run: node --test test/signing.test.mjs test/ci.test.mjs
