# .github/workflows/verify.yml
# Tests for pull requests (tooling changes by maintainers; community mods are
# submitted through issues, not pull requests). Read-only token, no secrets.
# The repository-wide strict check lives in resign.yml on main.

name: verify

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Signature format and CI rule tests
        run: node --test test/signing.test.mjs test/ci.test.mjs test/site.test.mjs
