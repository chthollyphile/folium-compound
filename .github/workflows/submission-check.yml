# .github/workflows/submission-check.yml
# Format check for community submission and update issues. The mod comes from
# the author's own repository: the named commit is fetched as data (shallow,
# no hooks, no submodules), staged the way it would be imported, and checked
# by the scripts from main. Nothing from the author's repository is executed,
# and this job holds no secrets.

name: submission-check

on:
  issues:
    types: [opened, edited, reopened, labeled]

permissions: {}

concurrency:
  group: submission-check-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  check:
    # `labeled` only re-checks when the submission label itself is added. A
    # maintainer setting `needs-changes` (or any other label) must not re-run the
    # check, which would reset the label to `awaiting-review`.
    if: >-
      (github.event.action != 'labeled'
        || github.event.label.name == 'mod-submission'
        || github.event.label.name == 'mod-update')
      && (contains(github.event.issue.labels.*.name, 'mod-submission')
        || contains(github.event.issue.labels.*.name, 'mod-update'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out main (the rules)
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the submission
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/ci/check-issue.mjs --issue "${{ github.event.issue.number }}"
