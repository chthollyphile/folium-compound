# .github/workflows/sign.yml
# A maintainer comments `/sign <commit>` on a reviewed submission or update
# issue: import that commit's mod files from the author's repository, sign them
# with the CI key and push main once.
#
# Two jobs so the key is only reachable after authorization: `authorize` has
# no secrets and checks the commenter's permission and that the issue still
# resolves to <commit>; only then does `sign` enter the `signing` environment
# (which holds FOLIUM_SIGNING_KEY_JSON and is restricted to main). The author's
# files are data throughout, never executed.

name: sign

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  authorize:
    if: ${{ !github.event.issue.pull_request && startsWith(github.event.comment.body, '/sign') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    outputs:
      authorized: ${{ steps.check.outputs.authorized }}
      issue: ${{ steps.check.outputs.issue }}
      commit: ${{ steps.check.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/ci/authorize-sign.mjs

  sign:
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    environment: signing
    permissions:
      contents: write
      issues: write
    concurrency:
      group: signing
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Import, sign and push
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FOLIUM_SIGNING_KEY_JSON: ${{ secrets.FOLIUM_SIGNING_KEY_JSON }}
        run: >
          node tools/ci/sign-issue.mjs
          --issue "${{ needs.authorize.outputs.issue }}"
          --commit "${{ needs.authorize.outputs.commit }}"
