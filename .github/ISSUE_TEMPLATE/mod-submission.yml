# .github/ISSUE_TEMPLATE/mod-submission.yml
# Submitting a new community mod from the author's own repository. Field labels
# are read by tools/ci/lib/submission.mjs (FORM_FIELDS); change both together.
name: 模组提交 / Mod submission
description: 从你自己的源码仓库提交一个新模组，审查通过后由 Folium 签名收录 / Submit a new mod from your own repository
title: "[模组提交] "
labels: ["mod-submission"]
body:
  - type: markdown
    attributes:
      value: |
        不需要 fork 本仓库。流程：
        1. 把模组放在你自己的公开仓库里（可以是仓库根目录，也可以是某个子目录），打一个 tag（推荐）或记下 commit。
        2. 填写本表单。CI 会取回那个提交，检查格式，并在这里回复将要签名的文件清单。
        3. 通过后请等待维护者审查；审查通过后维护者会签名，模组文件会被复制进本仓库并发布。
        4. 以后发布新版本时，开一个「模组更新」issue 即可。

        以 `.` 开头的文件和目录（`.git`、`.github` 等）以及 `node_modules` 不会被收录；不要提交 `folium.sig.json`；
        不能包含符号链接。模组规范见 Folia 仓库的 `mods/README.md`。
  - type: input
    id: mod-id
    attributes:
      label: 模组 id / Mod id
      description: 与 mod.json 的 id 相同
      placeholder: my-visualizer
    validations:
      required: true
  - type: input
    id: repository
    attributes:
      label: 源码仓库 / Source repository
      description: 公开仓库的 https 地址（GitHub、GitLab、Codeberg 等）
      placeholder: https://github.com/you/my-visualizer
    validations:
      required: true
  - type: input
    id: ref
    attributes:
      label: 版本 / Version (tag or commit)
      description: 要收录的 tag（推荐）、分支名或完整的 40 位 commit。审查和签名都绑定到它当时指向的 commit
      placeholder: v1.0.0
    validations:
      required: true
  - type: input
    id: path
    attributes:
      label: 模组目录 / Mod directory
      description: 仓库里 mod.json 所在的目录；在仓库根目录就留空
      placeholder: dist/my-visualizer
    validations:
      required: false
  - type: textarea
    id: description
    attributes:
      label: 模组说明 / Description
      description: 模组做什么、适用于哪些场景
    validations:
      required: true
  - type: textarea
    id: permissions
    attributes:
      label: 权限说明 / Permissions
      description: 逐条说明 mod.json 里声明的每个 permission、embedOrigins 和 experimental 为什么需要；没有就写「无」
    validations:
      required: true
  - type: input
    id: license
    attributes:
      label: 许可证 / License
      description: 模组的许可证；包含第三方库时请把它们的许可证文件放在模组目录里
      placeholder: MIT
    validations:
      required: true
  - type: checkboxes
    id: confirmations
    attributes:
      label: 确认 / Confirmations
      options:
        - label: 我是这个模组的作者，或有权代表作者提交 / I am the author or may submit on their behalf
          required: true
        - label: 模组不收集或上传用户数据，也不下载并执行远程代码（除非这是它明确声明的功能） / The mod does not collect user data or run remote code unless that is its declared purpose
          required: true
        - label: 我了解每个新版本都要经过审查才会签名 / I understand every new version is reviewed before it is signed
          required: true
