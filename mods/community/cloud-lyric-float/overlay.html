<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:; font-src 'self' data:;">
  <title>云风桌面歌词</title>
  <link rel="stylesheet" href="overlay.css">
</head>
<body class="mode-double">
  <div id="app" class="app">
    <div id="hitbox" class="hitbox" aria-hidden="true">
      <span class="hitbox-corner hitbox-tl"></span>
      <span class="hitbox-corner hitbox-tr"></span>
      <span class="hitbox-corner hitbox-bl"></span>
      <span class="hitbox-corner hitbox-br"></span>
      <span id="hitbox-label" class="hitbox-label">交互范围</span>
    </div>

    <main class="lyrics-shell drag-region" aria-live="polite">
      <header class="chrome" aria-label="歌词控制栏">
        <div class="meta-block">
          <span class="cloud-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M7.2 18.1h10.1a3.7 3.7 0 0 0 .2-7.4A5.7 5.7 0 0 0 6.6 9.3a4.4 4.4 0 0 0 .6 8.8Z"/>
              <path d="M9.4 13.6h5.4M10.8 16h2.6"/>
            </svg>
          </span>
          <span id="song-title" class="song-title">云风桌面歌词</span>
          <span id="artist" class="artist"></span>
        </div>

        <div class="controls">
          <button type="button" class="icon-btn" data-action="prev" title="上一首" aria-label="上一首">
            <svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM18.5 6.2v11.6L10 12z"/></svg>
          </button>
          <button type="button" class="icon-btn play-btn" data-action="play" title="播放 / 暂停" aria-label="播放或暂停">
            <svg class="icon-play" viewBox="0 0 24 24"><path d="M8 5.5v13L19 12z"/></svg>
            <svg class="icon-pause" viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
          </button>
          <button type="button" class="icon-btn" data-action="next" title="下一首" aria-label="下一首">
            <svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM5.5 6.2v11.6L14 12z"/></svg>
          </button>

          <span class="divider" aria-hidden="true"></span>

          <button type="button" class="text-btn" data-action="font-down" title="缩小歌词" aria-label="缩小歌词">A−</button>
          <button type="button" class="text-btn" data-action="font-up" title="放大歌词" aria-label="放大歌词">A+</button>
          <button type="button" class="icon-btn" data-action="settings" title="外观设置" aria-label="外观设置">
            <svg viewBox="0 0 24 24"><path d="M12 8.2a3.8 3.8 0 1 0 0 7.6 3.8 3.8 0 0 0 0-7.6Zm8 4.9v-2.2l-2.2-.4a7.2 7.2 0 0 0-.8-1.9l1.2-1.9-1.6-1.6-1.9 1.2a7.2 7.2 0 0 0-1.9-.8L12.4 3h-2.2l-.4 2.5a7.2 7.2 0 0 0-1.9.8L6 5.1 4.4 6.7l1.2 1.9a7.2 7.2 0 0 0-.8 1.9L2.3 11v2.2l2.5.4c.2.7.4 1.3.8 1.9l-1.2 1.9L6 19l1.9-1.2c.6.4 1.2.6 1.9.8l.4 2.4h2.2l.4-2.4c.7-.2 1.3-.4 1.9-.8l1.9 1.2 1.6-1.6-1.2-1.9c.4-.6.6-1.2.8-1.9l2.2-.4Z"/></svg>
          </button>
          <button type="button" class="icon-btn" data-action="focus-app" title="回到 Folia" aria-label="回到 Folia">
            <svg viewBox="0 0 24 24"><path d="M5 3h14a3 3 0 0 1 3 3v9a3 3 0 0 1-3 3h-4v2h3v2H6v-2h3v-2H5a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3Zm0 2a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1H5Z"/></svg>
          </button>
          <button type="button" class="icon-btn" data-action="lock" title="锁定鼠标穿透" aria-label="锁定鼠标穿透">
            <svg viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="9" rx="2.3"/><path d="M8.5 10.5V7.8a3.5 3.5 0 0 1 7 0v2.7"/></svg>
          </button>
          <button type="button" class="icon-btn danger" data-action="hide" title="隐藏歌词" aria-label="隐藏歌词">
            <svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg>
          </button>
        </div>
      </header>

      <section class="lyrics-stage">
        <div id="lines" class="lines"></div>
        <div id="empty" class="empty-state" hidden>
          <div class="empty-disc" aria-hidden="true">
            <span></span>
          </div>
          <div id="empty-title" class="empty-title">等待播放</div>
          <div id="empty-sub" class="empty-sub">在 Folia 播放音乐后，歌词会出现在这里</div>
        </div>
        <button id="unlock-hint" type="button" class="unlock-hint" data-action="lock" title="解锁鼠标穿透" aria-label="解锁鼠标穿透">
          <svg class="unlock-icon" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="5" y="10.5" width="14" height="9" rx="2.3"/>
            <path d="M8.5 10.5V7.8a3.5 3.5 0 0 1 6.8-1.2"/>
          </svg>
        </button>
        <div id="status-chip" class="status-chip" hidden>♪ 前奏</div>
      </section>
    </main>

    <aside id="settings" class="settings-panel" aria-label="悬浮歌词设置">
      <div class="settings-head">
        <div>
          <div class="settings-kicker">CLOUD LYRIC</div>
          <div class="settings-title">悬浮歌词外观</div>
        </div>
        <button type="button" class="icon-btn" data-action="close-settings" title="关闭设置" aria-label="关闭设置">
          <svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg>
        </button>
      </div>

      <div class="settings-scroll">
        <section class="setting-group">
          <div class="setting-label">显示模式</div>
          <div class="segmented" data-setting="mode">
            <button type="button" data-mode="single">单行</button>
            <button type="button" data-mode="double">双行</button>
            <button type="button" data-mode="multi">多行</button>
          </div>
        </section>

        <section class="setting-group">
          <div class="setting-label">拖动方式</div>
          <div class="segmented" data-setting="drag-mode">
            <button type="button" data-drag-mode="left">左键拖动</button>
            <button type="button" data-drag-mode="right-hold">右键长按</button>
            <button type="button" data-drag-mode="both">两者都开</button>
          </div>
        </section>

        <section class="setting-group">
          <div class="setting-row">
            <div class="setting-label">字号 <span id="font-value" class="setting-value">46</span></div>
            <input id="font-range" class="range" type="range" min="16" max="96" step="1" value="46" aria-label="歌词字号">
          </div>
        </section>

        <section class="setting-group two-col">
          <label class="color-field">
            <span>歌词颜色</span>
            <input id="text-color" type="color" value="#ffffff" aria-label="歌词颜色">
          </label>
          <label class="color-field">
            <span>逐字高亮</span>
            <input id="accent-color" type="color" value="#ff4d4f" aria-label="逐字高亮颜色">
          </label>
        </section>

        <section class="setting-group">
          <label class="switch-row">
            <span>
              <b>显示翻译</b>
              <small>跟随歌词数据自动显示</small>
            </span>
            <input id="show-translation" type="checkbox" checked>
            <i class="switch" aria-hidden="true"></i>
          </label>
          <label class="switch-row">
            <span>
              <b>显示音译</b>
              <small>日文 / 韩文歌曲更有用</small>
            </span>
            <input id="show-romanization" type="checkbox">
            <i class="switch" aria-hidden="true"></i>
          </label>
        </section>

        <section class="setting-group">
          <label class="switch-row">
            <span>
              <b>总在最前</b>
              <small>全屏窗口下也保持悬浮</small>
            </span>
            <input id="always-on-top" type="checkbox" checked>
            <i class="switch" aria-hidden="true"></i>
          </label>
          <label class="switch-row">
            <span>
              <b>全局快捷键</b>
              <small>Ctrl+Shift+H / L / ← / → / Space</small>
            </span>
            <input id="hotkeys" type="checkbox">
            <i class="switch" aria-hidden="true"></i>
          </label>
        </section>

        <section class="setting-actions">
          <button type="button" class="action-btn" data-action="reset-position">回到默认位置</button>
          <button type="button" class="action-btn primary" data-action="lock">锁定并穿透</button>
        </section>
        <p class="settings-tip">拖动标题栏可以移动外观面板；拖动歌词文字可以移动窗口。锁定后，把鼠标移到歌词上点击中央解锁图标。</p>
      </div>
    </aside>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </div>

  <script src="overlay.js"></script>
</body>
</html>
