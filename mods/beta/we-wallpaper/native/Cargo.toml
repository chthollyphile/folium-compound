[package]
name = "folia-we-capture"
version = "0.2.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2.16", default-features = false, features = ["napi8"] }
napi-derive = "2.16"
windows = { version = "=0.62.2", features = [
    "Foundation", "Graphics_Capture", "Graphics_DirectX_Direct3D11",
    "Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi_Common", "Win32_Security", "Win32_System_Com",
    "Win32_System_Threading", "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture", "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_Shell"
] }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = "symbols"
