<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'; img-src https: http: data: folia-cover:">
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: transparent; overflow: hidden;
    font-family: "Microsoft YaHei UI", "Segoe UI", "PingFang SC", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none; cursor: default;
  }
  .pill {
    position: absolute; inset: 2px 0;
    display: flex; align-items: center; gap: 8px;
    padding: 0 8px 0 4px; box-sizing: border-box;
    background: rgba(20, 20, 23, 0.74);
    border: 1px solid rgba(255, 255, 255, 0.10);
    border-radius: 9px;
    color: #fff; overflow: hidden;
  }
  .cover {
    width: 34px; height: 34px; border-radius: 6px; flex: none; object-fit: cover;
    background: linear-gradient(135deg, #5d6cff, #b06bff);
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
    cursor: pointer;
  }
  .cover.hidden { display: none; }
  .meta { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 1px; cursor: pointer; }
  .title {
    font-size: 12.5px; font-weight: 600; line-height: 16px; color: #fff;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .sub {
    font-size: 11px; line-height: 15px; color: rgba(255, 255, 255, 0.66);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .controls { flex: none; display: flex; align-items: center; gap: 1px; }
  button {
    all: unset; width: 28px; height: 28px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: rgba(255, 255, 255, 0.80); cursor: pointer;
  }
  button:hover { background: rgba(255, 255, 255, 0.13); color: #fff; }
  button:active { transform: scale(0.92); }
  button.play { width: 30px; height: 30px; background: rgba(255, 255, 255, 0.16); color: #fff; }
  button.play:hover { background: rgba(255, 255, 255, 0.24); }
  button.like.liked { color: #ff5d7a; }
  button.like.dim { opacity: 0.45; }
  button svg { width: 15px; height: 15px; display: block; }
  button.play svg { width: 15px; height: 15px; }
</style>
</head>
<body>
<div class="pill">
  <img class="cover" id="cover" alt="" draggable="false">
  <div class="meta">
    <div class="title" id="title">未在播放</div>
    <div class="sub" id="sub"></div>
  </div>
  <div class="controls">
    <button id="prev" title="上一首" aria-label="上一首">
      <svg viewBox="0 0 24 24" fill="none"><path d="M6 5v14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M19 5.5 9.5 12 19 18.5V5.5Z" fill="currentColor"/></svg>
    </button>
    <button id="toggle" class="play" title="播放 / 暂停" aria-label="播放或暂停">
      <svg id="toggleIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.2c0-.8.9-1.3 1.6-.9l9.4 6.1c.6.4.6 1.3 0 1.7l-9.4 6.1c-.7.4-1.6-.1-1.6-.9V5.2Z"/></svg>
    </button>
    <button id="next" title="下一首" aria-label="下一首">
      <svg viewBox="0 0 24 24" fill="none"><path d="M18 5v14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M5 5.5 14.5 12 5 18.5V5.5Z" fill="currentColor"/></svg>
    </button>
    <button id="like" class="like" title="喜欢" aria-label="喜欢">
      <svg viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1L12 21l7.7-7.6 1.1-1a5.5 5.5 0 0 0 0-7.8Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
    </button>
  </div>
</div>
<script src="controller.js"></script>
</body>
</html>
